{% if post.id %}
  {% assign title = post.title | markdownify | strip_html %}
{% else %}
  {% assign title = post.title %}
{% endif %}

<article class="entry publication-card">
  <header class="entry-header">
    <h3 class="entry-title">
      <a href="{{ post.url | relative_url }}" rel="bookmark">{{ title }}</a>
    </h3>
  </header>

  <div class="entry-excerpt">
    {% if post.excerpt %}
      {{ post.excerpt | markdownify }}

      <p>
        <a href="{{ post.url | relative_url }}" class="more-link">
          View publication
          <span class="icon icon--arrow-right">{% include icon-arrow-right.svg %}</span>
        </a>
      </p>
    {% endif %}
  </div>
</article>
